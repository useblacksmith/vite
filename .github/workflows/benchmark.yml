# Benchmark workflow for the vitejs/vite fork.
#
# Workload: the COMPLETE "test" job from upstream .github/workflows/ci.yml
# (transcribed from upstream 2026-07-23 -- re-verify against the file at the
# pinned commit), including Playwright browser install and the test-serve /
# test-build e2e suites. One matrix leg is run: ubuntu + node 24 (the leg
# upstream marks as active LTS). Nothing else is cut.
#
# Conventions shared by every fork's benchmark.yml:
#   - runs-on is mapped from the `environment` input; adding an environment
#     means adding one key to the fromJSON map below (see README).
#   - Steps whose duration IS the workload are named "workload: ...". The
#     orchestrator uses this prefix to tell workload failures (excluded with
#     reason) from infra failures (retried).
#   - cache_state=cold skips cache restore AND save (DECISIONS.md #6);
#     cache_state=warm uses upstream's own cache mechanism (here: setup-node
#     pnpm cache + the Playwright binary cache), which Blacksmith accelerates
#     transparently (DECISIONS.md #4). Warm cells are seeded by one excluded
#     run that populates the cache (DECISIONS.md #5).

name: benchmark
run-name: "bench ${{ inputs.environment }} ${{ inputs.cache_state }} ${{ inputs.batch_id }} ${{ inputs.run_key }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Runner environment under test
        type: choice
        required: true
        options: [github, github-8core, ec2, blacksmith, blacksmith-4vcpu]
      cache_state:
        description: cold = no caches, warm = upstream cache configuration
        type: choice
        required: true
        options: [cold, warm]
      batch_id:
        description: Collection batch this run belongs to
        type: string
        required: true
      run_key:
        description: Unique key set by the orchestrator to find this run via the API
        type: string
        required: true

permissions:
  contents: read

# Upstream ci.yml global env, verbatim.
env:
  NODE_OPTIONS: --max-old-space-size=6144
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  VITEST_SEGFAULT_RETRY: 3

jobs:
  benchmark:
    runs-on: ${{ fromJSON('{"github":"ubuntu-latest","github-8core":"benchmark-8core","ec2":"benchmark-ec2","blacksmith":"blacksmith-8vcpu-ubuntu-2404","blacksmith-4vcpu":"blacksmith-4vcpu-ubuntu-2404"}')[inputs.environment] }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Start telemetry
        uses: ./.github/actions/telemetry/start
        continue-on-error: true
        with:
          runner_label: ${{ inputs.environment }}

      # --- upstream "test" job steps, in upstream order ---

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node version to 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # upstream: cache: "pnpm" -- made conditional for cold/warm control
          cache: ${{ inputs.cache_state == 'warm' && 'pnpm' || '' }}

      - name: "workload: Install deps"
        run: pnpm install

      - name: Set Playwright path and Get playwright version
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/playwright-bin" >> $GITHUB_ENV
          PLAYWRIGHT_VERSION="$(pnpm ls --depth 0 --json -w playwright-chromium | jq --raw-output '.[0].devDependencies["playwright-chromium"].version')"
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: Cache Playwright's binary
        if: inputs.cache_state == 'warm'
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-playwright-bin-v1-${{ env.PLAYWRIGHT_VERSION }}
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          restore-keys: |
            ${{ runner.os }}-playwright-bin-v1-

      - name: "workload: Install Playwright"
        run: pnpm playwright install chromium

      - name: "workload: Build"
        run: pnpm run build

      - name: "workload: Test unit"
        run: pnpm run test-unit

      - name: "workload: Test serve"
        run: pnpm run test-serve

      - name: "workload: Test build"
        run: pnpm run test-build

      - name: Stop telemetry
        if: always()
        uses: ./.github/actions/telemetry/stop
